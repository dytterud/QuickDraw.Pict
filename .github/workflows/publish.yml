name: build

# Tests every push and pull request. A tag v<version> (e.g. v0.1.0) also packs that version and publishes it to
# nuget.org with Trusted Publishing (no stored API key), then creates a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test QuickDraw.Pict.slnx -c Release

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Trusted Publishing: GitHub's OIDC token is exchanged for a short-lived NuGet key
      contents: write      # the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pack
        run: dotnet pack QuickDraw.Pict.slnx -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
